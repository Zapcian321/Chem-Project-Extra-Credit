<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Bond Breaker - Chemistry Edition</title>
    <style>
        body {
            margin: 0;
            display: flex;
            height: 100vh;
            background: #1e1e1e;
            color: white;
            font-family: Arial, sans-serif;
        }

        #game-container {
            width: 100%;
            height: 100%;
            border: none;
        }

        #quiz-panel {
            display: none;
            position: fixed;
            top: 0; left:0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #quiz-box {
            background: 2d2d2d;
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            text-align: center;
        }

        button {
            margin-top: 10px;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            background: #007acc;
            color: white;
            border: none;
border-radius: 5px;
width: 100%;
        }
        button:hover {
            background: #005f9e;
        }
        #feedback {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
    <body>
        <iframe id="game-container" src="https://testtubegames.com/bondbreaker.html" allowfullscreen></iframe>
        <div id="quiz-panel">
            <div id="quiz-box">
            <h2>Chemistry Checkpoint</h2>
            <p id="question-text">Loading question...</p>
            <div id="options"></div>
            <p id="feedback"></p>
            </div>
        </div>
        <script>
            const questions = [
                {
                    q: "Sample Question", 
                    options: ["Wrong  Answer", "Incorrect Answer", "Not Right Answer", "Right Answer"], 
                    answer: 3
                }
            ];
            let currentQ = 0;

            function loadQuestion() {
                const qData = questions[currentQ];
                document.getElementById("question-text").innerText = qData.q;

                const optionsDiv = document.getElementById("options");
                optionsDiv.innerHTML = "";
                document.getElementById("feedback").innerText = "";

                qData.options.forEach((opt, index) => {
                    const btn = document.createElement("button");
                    btn.innerText = opt;
                    btn.onclick = () => checkAnswer(index);
                    optionsDiv.appendChild(btn);

                });
            }
            function checkAnswer(selected) {
                const feedback = document.getElementById("feedback");

                if (selected === questions[currentQ].answer) {
                    feedback.style.color = "#4caf50";
                    feeback.innerText = "Correct! Returning to game...";

                    setTimout(() => {
                        document.getElementById("quiz-panel").style.display = "none";
                        currentQ = (currentQ + 1) % questions.length;
                        loadQuestion();
                    }, 1500);
                } else {
                    feedback.style.color = "#f44336";
                    feedback.innerText = "Incorrect. Try Again";
                }
            }
            setInterval(() => {
                loadQuestion();
                document.getElementById("quiz-panel").style.display = "flex";
            }, 10000);
        </script>
        </body>
</head>
